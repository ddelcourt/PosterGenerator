<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jazz poster generator</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body data-appearance="light">
<div id="topRight">
  <button id="resetLayout" class="alt">Reset palette layout</button>
  <button id="themeToggle" aria-label="Toggle between light and dark mode">☀️ Light</button>
  <button id="fullscreenToggle" aria-label="Toggle fullscreen"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg></button>
</div>
<div id="palettes">

  <section class="pal" data-col="L">
    <div class="pal-bar"><span class="pal-title">Canvas Setup</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b">
      <div class="row"><span>Width (cm)</span><input type="number" data-k="w" min="5" max="300" step="0.5" value="89.5"></div>
      <div class="row"><span>Height (cm)</span><input type="number" data-k="h" min="5" max="300" step="0.5" value="128"></div>
      <div class="row"><span>Background</span><input type="color" data-k="bg" value="#ffffff" aria-label="Background color"></div>
    </div>
  </section>

  <section class="pal" data-col="L">
    <div class="pal-bar"><span class="pal-title">Layers</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b">
      <ul id="layerList" class="layers"></ul>
      <div class="add-layer-row">
        <button id="addLayerBtn" class="alt">＋ New Layer</button>
      </div>
    </div>
  </section>

  <section class="pal" data-col="L">
    <div class="pal-bar"><span class="pal-title">File</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b">
      <div class="file-row">
        <button id="save" class="alt">Save PNG</button>
      </div>
      <div class="file-row">
        <button id="saveSvg" class="alt">Save SVG</button>
        <button id="saveOutlined" class="alt">Save SVG (Outlined)</button>
      </div>
      <div class="file-row">
        <button id="exportJson" class="alt">Export JSON</button>
        <button id="importJson" class="alt">Load JSON</button>
      </div>
      <input type="file" id="jsonFile" accept=".json" style="display:none">
      <p class="preset-sep">Presets</p>
      <div class="file-row">
        <select id="presetSelect">
          <option value="">— select a preset —</option>
        </select>
        <button id="loadPresetBtn" class="alt">Load</button>
      </div>
      <div id="msg" role="status"></div>
    </div>
  </section>

  <!-- Layer Properties pane — content is generated dynamically by the active layer's module -->
  <section class="pal" id="properties" data-col="R">
    <div class="pal-bar"><span class="pal-title">Layer Properties</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b"></div>
  </section>

</div>
<div id="newLayerModal" class="modal-overlay" hidden>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="newLayerModalTitle">
    <h2 id="newLayerModalTitle" class="modal-title">New Layer</h2>
    <div class="modal-body">
      <label class="modal-label" for="newLayerType">Layer Type</label>
      <select id="newLayerType"></select>
    </div>
    <div class="modal-footer">
      <button type="button" id="newLayerCancel" class="alt">Cancel</button>
      <button type="button" id="newLayerCreate">Create</button>
    </div>
  </div>
</div>
<main id="stage"></main>

<script src="js/app.js"></script>
<script src="js/modules/recursive_div_1.js"></script>
<script src="js/modules/title_vertical.js"></script>
<script src="js/modules/gliding_text.js"></script>
<script src="js/modules/image_layers.js"></script>
<script src="js/libs/theme.js"></script>
<script src="js/libs/storage.js"></script>
<script src="js/libs/presets.js"></script>
<script src="js/libs/export.js"></script>
<script src="js/libs/ui.js"></script>
</body>
</html>
