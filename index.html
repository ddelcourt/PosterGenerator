<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jazz poster generator</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body data-appearance="light">
<div id="topRight">
  <button id="resetLayout" class="alt">Reset palette layout</button>
  <button id="themeToggle" aria-label="Toggle between light and dark mode">☀️ Light</button>
</div>
<div id="palettes">

  <section class="pal" data-col="L">
    <div class="pal-bar"><span class="pal-title">Poster</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b">
      <div class="row"><span>Width (cm)</span><input type="number" data-k="w" min="5" max="300" step="0.5" value="89.5"></div>
      <div class="row"><span>Height (cm)</span><input type="number" data-k="h" min="5" max="300" step="0.5" value="128"></div>
    </div>
  </section>

  <section class="pal" data-col="L">
    <div class="pal-bar"><span class="pal-title">Background</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b">
      <div class="row"><span>Color</span><input type="color" data-k="bg" value="#ffffff" aria-label="Background color"></div>
    </div>
  </section>

  <section class="pal" data-col="L">
    <div class="pal-bar"><span class="pal-title">Layers</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b"><ul id="layerList" class="layers"></ul></div>
  </section>

  <section class="pal" data-col="L">
    <div class="pal-bar"><span class="pal-title">Export</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b">
      <button id="save">Save PNG</button><button id="saveSvg" class="alt">Save SVG</button>
      <button id="saveOutlined">Save SVG (Outlined)</button>
      <button id="exportJson">Export JSON</button><button id="importJson" class="alt">Load JSON</button>
      <input type="file" id="jsonFile" accept=".json" style="display:none">
      <div id="msg" role="status"></div>
    </div>
  </section>

  <!-- Properties pane — content is generated dynamically by the active layer's module -->
  <section class="pal" id="properties" data-col="R">
    <div class="pal-bar"><span class="pal-title">Properties</span><button class="pal-toggle" aria-expanded="true" aria-label="Collapse or expand palette"></button></div>
    <div class="pal-b"></div>
  </section>

</div>
<main id="stage"></main>

<script src="js/app.js"></script>
<script src="js/modules/recursive_div_1.js"></script>
<script src="js/modules/title_vertical.js"></script>
<script src="js/modules/gliding_text.js"></script>
<script src="js/libs/theme.js"></script>
<script src="js/libs/storage.js"></script>
<script src="js/libs/export.js"></script>
<script src="js/libs/ui.js"></script>
</body>
</html>
